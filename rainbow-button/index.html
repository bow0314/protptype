<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rainbow Button Animation</title>
<style>
:root {
  --bg: rgb(16, 18, 24);
  --card-bg: rgb(29, 30, 38);
  color-scheme: dark;
}

:root:has(#theme-toggle:checked) {
  --bg: #f2f3f6;
  --card-bg: #ffffff;
  color-scheme: light;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: var(--bg);
  gap: 5rem;
  padding: 3rem 2rem 2rem 2rem;
  box-sizing: border-box;
  margin: 0;
  transition: background-color 0.3s ease;
}

.load {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  overflow: hidden;
  pointer-events: none;
  --skew: -10deg;
  --linear-aura-gradient: linear-gradient(
    to right in oklch,
    #f63b35 0%,
    #f63b35 3%,
    #1265f0 7%,
    #477dff 17%,
    #2caf4f 20%,
    #72bb44 25%,
    #ffe523 27%,
    #ffcc25 30%,
    #ea4335 33%,
    #ea4335 45%,
    #1265f0 49%,
    #477dff 68%,
    #34a853 72%,
    #2caf4f 79%,
    #ffe523 82%,
    #ffcc25 87%,
    #f63b35 90%,
    #f63b35 100%
  );
  --gradient-fade-margin: 1rem;
  --gradient-fade-distance: 10rem;
  mask-image: linear-gradient(
    45deg,
    transparent,
    transparent var(--gradient-fade-margin),
    black var(--gradient-fade-distance),
    black calc(100% - var(--gradient-fade-distance)),
    transparent calc(100% - var(--gradient-fade-margin)),
    transparent 100%
  );
}

.load::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--linear-aura-gradient);
  background-size: 50%, 100%;
  transform-origin: top left;
  transform: scale(16, 1);
  animation: gradient-slide 8s linear infinite;
}

.load-glow {
  position: absolute;
  top: 2px;
  left: 0;
  width: 100%;
  height: 2.5rem;
  opacity: 0.25;
  overflow: hidden;
  pointer-events: none;
  --skew: -10deg;
  --linear-aura-gradient: linear-gradient(
    to right in oklch,
    #f63b35 0%,
    #f63b35 3%,
    #1265f0 7%,
    #477dff 17%,
    #2caf4f 20%,
    #72bb44 25%,
    #ffe523 27%,
    #ffcc25 30%,
    #ea4335 33%,
    #ea4335 45%,
    #1265f0 49%,
    #477dff 68%,
    #34a853 72%,
    #2caf4f 79%,
    #ffe523 82%,
    #ffcc25 87%,
    #f63b35 90%,
    #f63b35 100%
  );
}

.load-glow::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--linear-aura-gradient);
  background-size: 50%, 100%;
  transform-origin: top left;
  transform: scale(16, 1);
  animation: gradient-slide 8s linear infinite;
}

.load-glow::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  inset: 0;
  background: var(--bg);
  --shadow-inset: 5rem;
  mask-image: radial-gradient(ellipse at top center, transparent 0, black 100%),
    linear-gradient(
      to right,
      black 0,
      transparent var(--shadow-inset),
      transparent calc(100% - var(--shadow-inset)),
      black 100%
    ),
    linear-gradient(to bottom, transparent, black);
}

@keyframes gradient-slide {
  0% {
    transform: skew(var(--skew)) scale(16, 1) translate(-50%, 0);
  }
  100% {
    transform: skew(var(--skew)) scale(16, 1) translate(0, 0);
  }
}

.wrapper-1,
.wrapper-2 {
  position: relative;
  width: 35rem;
  height: 10rem;
  background-color: var(--card-bg);
  border-radius: 1.5rem;
  contain: paint;
  transition: background-color 0.3s ease;
}

.wrapper-1 .layer-1 {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  contain: paint;
}

.wrapper-1 .layer-1::before {
  content: "";
  position: absolute;
  border-radius: inherit;
  background: conic-gradient(
      rgba(52, 168, 82, 0) 0deg,
      rgba(52, 168, 82, 0.7) 22deg,
      rgba(255, 211, 20, 1) 50deg,
      rgba(255, 211, 20, 1) 108deg,
      rgba(255, 70, 65, 1) 141deg,
      rgba(49, 134, 255, 1) 159deg,
      rgba(49, 134, 255, 0.5) 245deg,
      rgba(49, 134, 255, 0) 338deg,
      rgba(52, 168, 82, 0) 360deg
    )
    border-box;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  width: 125%;
  aspect-ratio: 1 / 1;
  scale: 1 0.4;
  pointer-events: none;
  filter: blur(20px);
  animation: ambient-spin 7s linear infinite;
  contain: paint;
  transition: opacity 0.3s;
}

@keyframes ambient-spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(1turn);
  }
}

.wrapper-1 .layer-2 {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid transparent;
  contain: paint;
  transition: border-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.wrapper-1 .layer-2::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  filter: blur(25px);
  background-color: var(--card-bg);
  contain: paint;
  transition: filter 0.3s, background-color 0.3s ease;
}

.wrapper-2 {
  contain: none;
}

.wrapper-2 .layer-1 {
  filter: blur(10px);
  position: absolute;
  inset: 0;
  border-radius: inherit;
  contain: paint;
}

.wrapper-2 .layer-1::before,
.wrapper-2 .layer-2::before {
  content: "";
  position: absolute;
  border-radius: inherit;
  background: conic-gradient(
      rgba(52, 168, 82, 0) 0deg,
      rgba(52, 168, 82, 0.7) 22deg,
      rgba(255, 211, 20, 1) 50deg,
      rgba(255, 211, 20, 1) 108deg,
      rgba(255, 70, 65, 1) 141deg,
      rgba(49, 134, 255, 1) 159deg,
      rgba(49, 134, 255, 0.5) 245deg,
      rgba(49, 134, 255, 0) 338deg,
      rgba(52, 168, 82, 0) 360deg
    )
    border-box;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  width: 125%;
  aspect-ratio: 1 / 1;
  scale: 1 0.4;
  pointer-events: none;
  filter: blur(20px);
  animation: ambient-spin 2s linear infinite;
  contain: paint;
  transition: opacity 0.3s;
}

.wrapper-2 .layer-2 {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  contain: paint;
  background-color: var(--card-bg);
  transition: background-color 0.3s ease;
}

.wrapper-2 .layer-3 {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid transparent;
  contain: paint;
  transition: border-width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.wrapper-2 .layer-3::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: calc(1.5rem - 2px);
  background-color: var(--card-bg);
  contain: paint;
  transition: filter 0.3s, background-color 0.3s ease;
}

.wrapper-2 .rainbow-line {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1px solid transparent;
  background: conic-gradient(
      rgba(52, 168, 82, 0) 0deg,
      rgba(52, 168, 82, 0.7) 22deg,
      rgba(255, 211, 20, 1) 50deg,
      rgba(255, 211, 20, 1) 108deg,
      rgba(255, 70, 65, 1) 141deg,
      rgba(49, 134, 255, 1) 159deg,
      rgba(49, 134, 255, 0.5) 245deg,
      rgba(49, 134, 255, 0) 338deg,
      rgba(52, 168, 82, 0) 360deg
    )
    border-box;
  -webkit-mask:
    linear-gradient(#fff 0 0) padding-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.theme-switch {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  z-index: 10;
}

.theme-switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.theme-switch .track {
  position: relative;
  display: block;
  box-sizing: border-box;
  width: 3.75rem;
  height: 2.1rem;
  border-radius: 999px;
  background-color: var(--card-bg);
  border: 1px solid rgba(128, 128, 128, 0.3);
  cursor: pointer;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}

.theme-switch .icon {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.85rem;
  line-height: 1;
  opacity: 0.5;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.theme-switch .icon.sun {
  left: 0.4rem;
}

.theme-switch .icon.moon {
  right: 0.4rem;
}

.theme-switch .thumb {
  position: absolute;
  top: 0.15rem;
  left: 0.15rem;
  width: 1.7rem;
  height: 1.7rem;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.theme-switch input:checked ~ .track .thumb {
  left: calc(100% - 1.7rem - 0.15rem);
}

.theme-switch input:checked ~ .track .icon.sun {
  opacity: 0.2;
}

.theme-switch input:not(:checked) ~ .track .icon.moon {
  opacity: 0.2;
}
</style>
</head>
<body>
<label class="theme-switch" aria-label="切換明暗模式">
  <input type="checkbox" id="theme-toggle" />
  <span class="track">
    <span class="icon sun">&#9728;</span>
    <span class="icon moon">&#9790;</span>
    <span class="thumb"></span>
  </span>
</label>

<div class="load"></div>
<div class="load-glow"></div>

<div class="wrapper-1">
  <div class="layer-1"></div>
  <div class="layer-2"></div>
</div>

<div class="wrapper-2">
  <div class="layer-1"></div>
  <div class="layer-2"></div>
  <div class="layer-3"></div>
  <div class="rainbow-line"></div>
</div>
</body>
</html>
